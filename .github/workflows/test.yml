name: Test
on:
  push:
  pull_request:
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
      - name: Tests
        run: go test ./...
      - name: Vet
        run: go vet ./...
      - name: Build
        run: go build -o timo${{ runner.os == 'Windows' && '.exe' || '' }} .
